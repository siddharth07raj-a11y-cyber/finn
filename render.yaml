services:
  - type: web
    name: finn
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: FINN_DATA_MODE
        value: live
      - key: FINN_LLM_PROVIDER
        value: gemini
      - key: FINN_LLM_KEY
        sync: false
      - key: FINN_MODEL_CHEAP
        sync: false
      - key: FINN_MODEL_STRONG
        sync: false
